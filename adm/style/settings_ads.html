{% include 'overall_header.html' %}

<a id="maincontent"></a>

<h1>{{ lang('SETTINGS') }}</h1>

<form id="acp_addmanagement_settings" method="post" action="{{ U_ACTION }}">
	<fieldset>
		<legend>{{ lang('ADBLOCKER_LEGEND') }}</legend>
		<dl>
			<dt><label for="adblocker_message">{{ lang('ADBLOCKER_MESSAGE') ~ lang('COLON') }}</label><br><span>{{ lang('ADBLOCKER_MESSAGE_EXPLAIN') }}</span></dt>
			<dd>
				<select name="adblocker_message" id="adblocker_message">
					{% for ad_block_mode in AD_BLOCK_MODES %}
						<option value="{{ ad_block_mode }}"{% if ad_block_mode == AD_BLOCK_CONFIG %} selected="selected"{% endif %}>{% if ad_block_mode === 0 %}{{ lang('ADBLOCKER_ALLOW') }}{% elseif ad_block_mode === 1 %}{{ lang('ADBLOCKER_ASK') }}{% else %}{{ lang('ADBLOCKER_REQUIRE') }}{% endif %}</option>
					{% endfor %}
				</select>
			</dd>
		</dl>
	</fieldset>
	<fieldset>
		<legend>{{ lang('PRIVACY_LEGEND') }}</legend>
		<dl>
			<dt><label for="show_agreement">{{ lang('SHOW_AGREEMENT') ~ lang('COLON') }}</label><br><span>{{ lang('SHOW_AGREEMENT_EXPLAIN') }}</span></dt>
			<dd><label><input type="radio" class="radio" id="show_agreement" name="show_agreement" value="1"{% if SHOW_AGREEMENT %} checked{% endif %}> {{ lang('YES') }}</label>
				<label><input type="radio" class="radio" name="show_agreement" value="0"{% if not SHOW_AGREEMENT %} checked{% endif %}> {{ lang('NO') }}</label></dd>
		</dl>
	</fieldset>
	<fieldset class="submit-buttons">
		<input class="button1" type="submit" id="submit" name="submit" value="{{ lang('SUBMIT') }}">&nbsp;
		<input class="button2" type="reset" id="reset" name="reset" value="{{ lang('RESET') }}">
		{{ S_FORM_TOKEN }}
	</fieldset>
</form>

{% include 'overall_footer.html' %}
