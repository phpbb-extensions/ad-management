{% if S_PHPBB_ADS %}
	<script>
	/**
	 * This callback replaces enable links with disable links and vice versa.
	 * It does this by replacing the text, and replacing all instances of "enable"
	 * in the href with "disable", and vice versa.
	 */
	phpbb.addAjaxCallback('toggle_enable', function(res) {
		'use strict';

		var $this = $(this),
			newHref = $this.attr('href');

		$this.text(res.text);
		$this.attr('title', res.title);

		if (newHref.indexOf('disable') !== -1) {
			newHref = newHref.replace('disable', 'enable');
		} else {
			newHref = newHref.replace('enable', 'disable');
		}

		$this.attr('href', newHref);
	});

	jQuery(function($) {
		$('#analyse_ad_code').on('click', function(e) {
			e.preventDefault();

			var $button = $(this),
				$form = $('#acp_ad_code_analyser'),
				$results = $('#analyser_results'),
				formData = new FormData($form[0]);

			formData.append('ad_code', $('#ad_code').val());

			$button.prop('disabled', true);
			$.ajax({
				method: 'POST',
				url: $form.attr('action'),
				data: formData,
				processData: false,
				cache: false,
				contentType: false,
				success: function(data) {
					if (!data.success) {
						phpbb.alert(data.title, data.text);
						return;
					}

					$results.empty();
					if (!data.results.length) {
						$('<p>').addClass('successbox').text(data.everything_ok).appendTo($results);
						return;
					}

					$.each(data.results, function(i, result) {
						$('<p>')
							.addClass(result.severity === 'warning' ? 'errorbox' : 'warningbox')
							.html(result.message)
							.appendTo($results);
					});
				},
				error: function() {
					phpbb.alert('{{ lang('AJAX_ERROR_TITLE')|e('js') }}', '{{ lang('AJAX_ERROR_TEXT')|e('js') }}');
				},
				complete: function() {
					$button.prop('disabled', false);
				}
			});
		});

		$('#upload_banner').on('click', function(e) {
			e.preventDefault();

			var $form = $(this).closest('form'),
				file = $('#banner')[0].files[0];
			if (file) {
				var formData = new FormData();
				formData.append('banner', file);
				formData.append('upload_banner', true);
				$form.find('input[name="creation_time"], input[name="form_token"]').each(function() {
					formData.append(this.name, this.value);
				});
				$.ajax({
					method: 'POST',
					url: window.location.href,
					data: formData,
					processData: false,
					async: true,
					cache: false,
					contentType: false,
					success: function(data) {
						if (data.success) {
							$('#ad_code').val(function(i, text) {
								return (text.length ? text + "\n\n" : '') + data.text;
							});
						}
						else {
							phpbb.alert(data.title, data.text);
						}
					},
					error: function(err) {
						phpbb.alert(err.title, err.text);
					}
				});
			}
			else {
				phpbb.alert('{{ lang('INFORMATION')|e('js') }}', '{{ lang('NO_FILE_SELECTED')|e('js') }}');
			}
		});
	});
	</script>
{% endif %}
