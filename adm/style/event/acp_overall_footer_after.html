{% if S_PHPBB_ADS %}
	<script>
	/**
	 * This callback replaces enable links with disable links and vice versa.
	 * It does this by replacing the text, and replacing all instances of "enable"
	 * in the href with "disable", and vice versa.
	 */
	phpbb.addAjaxCallback('toggle_enable', function(res) {
		'use strict';

		var $this = $(this),
			newHref = $this.attr('href');

		$this.text(res.text);
		$this.attr('title', res.title);

		if (newHref.indexOf('disable') !== -1) {
			newHref = newHref.replace('disable', 'enable');
		} else {
			newHref = newHref.replace('enable', 'disable');
		}

		$this.attr('href', newHref);
	});

	jQuery(function($) {
		var $previewOutput = $('#phpbb-preview-output'),
			$previewNotice = $('#phpbb-preview-notice'),
			previewChecks = 0,
			previewTimer;

		if ($previewOutput.length && $previewNotice.length) {
			function hasVisibleBox(element) {
				var elementStyle = window.getComputedStyle ? window.getComputedStyle(element) : element.currentStyle,
					elementRect = element.getBoundingClientRect();

				return (!elementStyle || (
					elementStyle.display !== 'none' &&
					elementStyle.visibility !== 'hidden' &&
					parseFloat(elementStyle.opacity) !== 0
				)) && elementRect.width > 2 && elementRect.height > 2;
			}

			previewTimer = window.setInterval(function() {
				var preview = document.getElementById('phpbb-preview-content'),
					isBlocked = !preview,
					isVisible = false,
					children,
					hasFailedImage = false,
					hasLoadedImage = false,
					i,
					images,
					style,
					tagName;

				previewChecks++;
				if (preview) {
					style = window.getComputedStyle ? window.getComputedStyle(preview) : preview.currentStyle;
					isBlocked = !document.documentElement.contains(preview) || (style && (
						style.display === 'none' ||
						style.visibility === 'hidden' ||
						parseFloat(style.opacity) === 0
					));

					// A failed image can still give its wrapper visible dimensions.
					// Treat an image-only preview with no successfully loaded image as blocked.
					images = preview.getElementsByTagName('img');
					for (i = 0; i < images.length; i++) {
						if (images[i].complete && images[i].naturalWidth === 0) {
							hasFailedImage = true;
						} else if (images[i].complete && images[i].naturalWidth > 0) {
							hasLoadedImage = true;
						}
					}

					if (hasFailedImage && !hasLoadedImage && !$.trim(preview.textContent || preview.innerText || '') &&
						!preview.querySelector('iframe, video, canvas, svg, object, embed')) {
						isBlocked = true;
					}

					isVisible = !isBlocked && hasVisibleBox(preview);

					// Some previews position visible content outside a zero-height wrapper.
					if (!isBlocked && !isVisible) {
						children = preview.querySelectorAll('*');
						for (i = 0; i < children.length; i++) {
							tagName = children[i].tagName;
							if (tagName !== 'SCRIPT' && tagName !== 'STYLE' && tagName !== 'LINK' && hasVisibleBox(children[i])) {
								isVisible = true;
								break;
							}
						}
					}
				}

				if (isVisible) {
					$previewNotice.hide();
					window.clearInterval(previewTimer);
					return;
				}

				// Allow asynchronous ad code time to produce visible output.
				if (previewChecks >= 6) {
					$('#phpbb-preview-notice-title').text(isBlocked
						? '{{ lang('AD_PREVIEW_BLOCKED')|e('js') }}'
						: '{{ lang('AD_PREVIEW_EMPTY')|e('js') }}');
					$('#phpbb-preview-notice-text').text(isBlocked
						? '{{ lang('AD_PREVIEW_BLOCKED_EXPLAIN')|e('js') }}'
						: '{{ lang('AD_PREVIEW_EMPTY_EXPLAIN')|e('js') }}');
					$previewNotice.show();
				}

				// Keep checking in case a slow asynchronous preview appears later.
				if (previewChecks >= 30) {
					window.clearInterval(previewTimer);
				}
			}, 500);
		}

		$('#analyse_ad_code').on('click', function(e) {
			e.preventDefault();

			var $button = $(this),
				$form = $('#acp_ad_code_analyser'),
				$results = $('#analyser_results'),
				formData = new FormData($form[0]);

			formData.append('ad_code', $('#ad_code').val());

			$button.prop('disabled', true);
			$.ajax({
				method: 'POST',
				url: $form.attr('action'),
				data: formData,
				processData: false,
				cache: false,
				contentType: false,
				success: function(data) {
					if (!data.success) {
						phpbb.alert(data.title, data.text);
						return;
					}

					$results.empty();
					if (!data.results.length) {
						$('<p>').addClass('successbox').text(data.everything_ok).appendTo($results);
						return;
					}

					$.each(data.results, function(i, result) {
						$('<p>')
							.addClass(result.severity === 'warning' ? 'errorbox' : 'warningbox')
							.html(result.message)
							.appendTo($results);
					});
				},
				error: function() {
					phpbb.alert('{{ lang('AJAX_ERROR_TITLE')|e('js') }}', '{{ lang('AJAX_ERROR_TEXT')|e('js') }}');
				},
				complete: function() {
					$button.prop('disabled', false);
				}
			});
		});

		$('#upload_banner').on('click', function(e) {
			e.preventDefault();

			var $form = $(this).closest('form'),
				file = $('#banner')[0].files[0];
			if (file) {
				var formData = new FormData();
				formData.append('banner', file);
				formData.append('upload_banner', true);
				$form.find('input[name="creation_time"], input[name="form_token"]').each(function() {
					formData.append(this.name, this.value);
				});
				$.ajax({
					method: 'POST',
					url: window.location.href,
					data: formData,
					processData: false,
					async: true,
					cache: false,
					contentType: false,
					success: function(data) {
						if (data.success) {
							$('#ad_code').val(function(i, text) {
								return (text.length ? text + "\n\n" : '') + data.text;
							});
						}
						else {
							phpbb.alert(data.title, data.text);
						}
					},
					error: function(err) {
						phpbb.alert(err.title, err.text);
					}
				});
			}
			else {
				phpbb.alert('{{ lang('INFORMATION')|e('js') }}', '{{ lang('NO_FILE_SELECTED')|e('js') }}');
			}
		});
	});
	</script>
{% endif %}
